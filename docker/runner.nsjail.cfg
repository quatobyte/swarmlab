# Черновик песочницы раннера на портале (M9b, DECISIONS №93; проверка — docs/ROADMAP.md).
#
# Сервер запускает раннер так (префикс — `sandbox.runner_prefix` в public.yaml):
#   nsjail --config /app/docker/runner.nsjail.cfg --bindmount_ro <скрипт улья> -- \
#       /opt/venv/bin/python -m swarmlab.runner
# Протокол раннера тот же: stdin/stdout/stderr nsjail передаёт процессу как есть.
# Окружение уже очищено ядром (`runner_env`: PYTHONHASHSEED, PYTHONIOENCODING,
# PYTHONUNBUFFERED, PYTHONPATH) — nsjail передаёт его без изменений (`keep_env`).
#
# Формат — protobuf text (nsjail config.proto, версия nsjail — в Dockerfile).

name: "swarmlab-runner"
description: "Раннер кода игрока SwarmLab: без сети, только чтение, лимиты"

mode: ONCE
hostname: "sandbox"
cwd: "/tmp"
log_level: WARNING

# Время жизни процесса раннера, с (матч на паузе дольше — раннер перезапустится, §3.4).
time_limit: 3600
# Один процессор (sched_setaffinity).
max_cpus: 1
keep_env: true

# --- лимиты (setrlimit; память и размер файла — МБ, процессор — с) ---------------------
rlimit_as_type: VALUE
rlimit_as: 512
rlimit_cpu_type: VALUE
rlimit_cpu: 900
rlimit_fsize_type: VALUE
rlimit_fsize: 16
rlimit_nofile_type: VALUE
rlimit_nofile: 64
# Процессов и потоков (у раннера их 2). Считается в своём пространстве пользователей
# (ядро ≥ 5.14): fork-бомба одного улья не съедает лимит других.
rlimit_nproc_type: VALUE
rlimit_nproc: 16
rlimit_core_type: VALUE
rlimit_core: 0

# --- пространства имён ------------------------------------------------------------------
clone_newnet: true      # своя сеть: без интерфейсов наружу
iface_no_lo: true       # и даже loopback не поднят
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# Отдельный непривилегированный пользователь: внутри 99999, снаружи — 100000 из диапазона
# /etc/subuid пользователя swarmlab (newuidmap), а не uid сервера.
uidmap {
  inside_id: "99999"
  outside_id: "100000"
  count: 1
  use_newidmap: true
}
gidmap {
  inside_id: "99999"
  outside_id: "100000"
  count: 1
  use_newidmap: true
}

# --- файловая система: всё только для чтения, кроме /tmp ------------------------------
# Корень — пустой tmpfs nsjail; видно только перечисленное. Нет /data (база, папки
# пользователей), /app (.env, конфиги), /home, /proc.
mount_proc: false
mount { src: "/usr" dst: "/usr" is_bind: true }
mount { src: "/lib" dst: "/lib" is_bind: true }
mount { src: "/lib64" dst: "/lib64" is_bind: true mandatory: false }
mount { src: "/etc/ld.so.cache" dst: "/etc/ld.so.cache" is_bind: true mandatory: false }
# Интерпретатор (venv ссылается на /usr/local) и пакет swarmlab.
mount { src: "/opt/venv" dst: "/opt/venv" is_bind: true }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true }
mount { src: "/dev/zero" dst: "/dev/zero" is_bind: true }
# Единственное место для записи — своя временная папка (в памяти, 16 МБ).
mount { dst: "/tmp" fstype: "tmpfs" rw: true is_dir: true options: "size=16777216" nosuid: true nodev: true }
# Скрипт улья — `--bindmount_ro {script}` в префиксе (только чтение, по своему пути).

# --- системные вызовы ------------------------------------------------------------------
# Сверх профиля seccomp контейнера (docker/seccomp.json): коду игрока не нужны отладка
# чужих процессов, BPF, ключи ядра, новые пространства имён и монтирование.
seccomp_string: "ERRNO(1) {"
seccomp_string: "  ptrace, process_vm_readv, process_vm_writev, bpf, userfaultfd,"
seccomp_string: "  perf_event_open, keyctl, add_key, request_key, unshare, setns, mount,"
seccomp_string: "  umount2, pivot_root, init_module, finit_module, delete_module, kexec_load,"
seccomp_string: "  open_by_handle_at, name_to_handle_at, acct, swapon, swapoff, reboot,"
seccomp_string: "  clone(flags) { (flags & 0x7E020000) != 0 }"
seccomp_string: "}"
seccomp_string: "DEFAULT ALLOW"
