[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmlab"
version = "0.0.1"
description = "Модульный 3D-симулятор роевых систем"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Зависимости ядра. Физика модуля (MuJoCo и др.) — в pyproject.toml ветки модуля.
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "msgpack>=1.0",
    "zstandard>=0.22",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",       # WebSocket в uvicorn (живой стрим вьюера)
    "greenlet>=3.0",        # лёгкие потоки loop() в раннере (DECISIONS №84)
    "argon2-cffi>=23.1",    # пароли аккаунтов портала (`serve --public`, DECISIONS №97)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
swarmlab = "swarmlab.cli:main"

# Модули-сценарии регистрируются в ветке модуля (DECISIONS №98), в master их нет:
#   [project.entry-points."swarmlab.modules"]      <имя> = "swarmlab.<имя>.module:<Класс>"
#   [project.entry-points."swarmlab.agent_hosts"]  <имя> = "swarmlab.<имя>.player_host:<Хост>"
# Ядро находит модуль по имени, не импортируя его напрямую.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"swarmlab.server" = ["public.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = [
    "RUF001",  # кириллица в строках — ожидаема
    "RUF002",
    "RUF003",
]
