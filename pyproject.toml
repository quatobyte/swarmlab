[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmlab"
version = "0.0.1"
description = "Модульный 3D-симулятор роевых систем"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "msgpack>=1.0",
    "zstandard>=0.22",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",       # WebSocket в uvicorn (живой стрим вьюера)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
swarmlab = "swarmlab.cli:main"

# Модули-сценарии регистрируются здесь; ядро находит их по имени, не импортируя напрямую.
[project.entry-points."swarmlab.modules"]
bees = "swarmlab.bees.module:BeesModule"

# Хосты кода игрока для процесса-раннера (`python -m swarmlab.runner`): имя модуля → AgentHost.
[project.entry-points."swarmlab.agent_hosts"]
bees = "swarmlab.bees.player_host:HiveHost"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = [
    "RUF001",  # кириллица в строках — ожидаема
    "RUF002",
    "RUF003",
]
