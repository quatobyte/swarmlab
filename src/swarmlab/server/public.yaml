# Настройки публичного режима `swarmlab serve --public` (портал, DECISIONS №91–92, 97).
# Свой файл (`--public-config путь.yaml`) накладывается поверх этого: достаточно указать
# только то, что меняется.

accounts:
  # Длина пароля, символов.
  password_min: 8
  password_max: 256
  # Сколько дней живёт вход (cookie сессии), потом — войти заново.
  session_days: 30

cookie:
  # Имя cookie сессии (HTTP-only, SameSite=Lax).
  name: swarmlab_session
  # Флаг Secure: auto — когда запрос пришёл по HTTPS (за прокси — по X-Forwarded-Proto
  # от доверенного адреса), always — всегда, never — никогда.
  secure: auto

limits:
  # Регистраций с одного IP за окно.
  register_per_ip: 3
  register_window_s: 3600
  # Неверных паролей к одной почте за окно → вход временно закрыт.
  login_failures: 5
  login_window_s: 900
  login_lockout_s: 900

replays:
  # Последние незакреплённые реплеи пользователя хранятся сами.
  keep_last: 10
  # Квота закреплённых («Сохранить»): штук и мегабайт.
  pinned_max_count: 50
  pinned_max_mb: 500
  # Незакреплённые старше стольких дней удаляются очисткой (конец матча, старт сервера).
  unpinned_max_age_days: 7

proxy:
  # Адреса доверенного обратного прокси (Caddy). Только от них сервер верит
  # X-Forwarded-For (IP клиента) и X-Forwarded-Proto (HTTPS). Пусто — прокси нет.
  trusted: []

sandbox:
  # Песочница кода игрока (DECISIONS №93): префикс команды запуска раннера. Ядро
  # подставляет {python}, {script} (абсолютный путь к скрипту улья) и {script_dir}, затем
  # добавляет `python -m swarmlab.runner`. Настройка — для образа Docker (`Dockerfile`):
  # nsjail без сети, только чтение, лимиты процессора, памяти, процессов и файлов.
  # Пустой список [] — без песочницы: код игрока получает все права сервера. Только для
  # пробы портала на своём компьютере (`--public-config` с `sandbox: {runner_prefix: []}`).
  runner_prefix: [nsjail, --quiet, --config, /app/docker/runner.nsjail.cfg,
                  --bindmount_ro, "{script}", --]

matches:
  # Живых матчей у одного пользователя: новый вытесняет его же старый (DECISIONS №94).
  per_user: 1
  # Живых матчей на сервере; остальные ждут в очереди с номером и стартуют сами.
  total: 4
  # Разрешённые профили; ключи, которые задаёт профиль (размер карты, ульи, пчёлы, частоты),
  # а также `runner.*` и `timing.*` в переопределениях матча менять нельзя.
  profiles: [small, medium]
  # Матч (и место в очереди) без зрителей столько секунд — останавливается, реплей дописан.
  idle_stop_s: 60

series:
  # Серии из веба: матчей в серии не больше, процессов одновременно, серий на сервер.
  n_max: 10
  jobs_max: 1
  total: 1
