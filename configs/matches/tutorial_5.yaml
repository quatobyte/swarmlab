# Обучение, миссия 5 «Паучьи поляны» (M11, DECISIONS №100): разведчик проверяет цветы,
# сборщик садится только на названный цветок. Пауки на трети цветов и опасны.

seed: 10
profile: small
duration_s: 360

hives:
  - {script: examples/bees/template.py, color: "#f5b700"}

weather: {enabled: false}
enemies:
  spiders: {enabled: true, flower_fraction: 0.3, kill_prob_per_s: 0.5}
world:
  flowers: {clusters_per_hive: 4, flowers_per_cluster: 12, cluster_distance: [20.0, 45.0]}
economy:
  start_honey: 10.0
  start_bees: {scout: 1, forager: 5, house: 3}
