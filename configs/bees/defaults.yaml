# Параметры модуля «Swarm Logic» (пчёлки) по умолчанию.
# Источник — docs/BEES_SPEC.md. Все числа — стартовые значения для балансировки.
# Единицы: м, с, кг, Н, Дж; нектар и мёд — условные единицы (ед.).
#
# Порядок слоёв: этот файл → configs/profiles/<профиль>.yaml (секция bees:) →
# файл матча → overrides матча → `--set` из командной строки.
# Значение null у параметра = «будет откалибровано» (tools/calibrate.py, веха M1).

# ---------------------------------------------------------------- §1 Мир
world:
  map_size: 300.0            # сторона квадратной карты, м (центр карты — начало координат)
  ceiling_agl: 30.0          # потолок полёта над рельефом, м
  n_hives: 3                 # число ульев (1–3), задаётся профилем

  terrain:
    grid: 128                # сетка heightfield, узлов по стороне
    max_relief: 8.0          # перепад высот рельефа, м
    octaves: 5               # октавы fBm-шума
    base_cells: 4            # клеток решётки шума на сторону в первой октаве
    persistence: 0.5         # множитель амплитуды на каждую следующую октаву
    base_thickness: 1.0      # толщина «подложки» heightfield под нулём, м

  trees:                     # ствол-капсула + крона-сфера, обе твёрдые
    per_ha: 7.0              # деревьев на гектар (плотность задаёт профиль)
    trunk_radius: [0.25, 0.45]   # диапазон радиуса ствола, м
    trunk_height: [3.0, 6.0]     # диапазон высоты ствола, м
    crown_radius: [1.5, 3.0]     # диапазон радиуса кроны, м
    hive_clearance: 15.0     # не ближе к ульям, м
    edge_margin: 3.0         # отступ от края карты, м

  rocks:                     # боксы
    per_ha: 2.0
    half_size: [0.4, 1.5]    # диапазон полуразмеров по каждой оси, м
    hive_clearance: 15.0
    edge_margin: 3.0

  hives:                     # статичные боксы с летком
    spacing: 150.0           # сторона треугольника (3 улья) / расстояние (2 улья), м
    half_size: [1.5, 1.5]    # полуразмеры основания по x, y, м
    height: 2.5              # высота над самой высокой точкой рельефа под ульем, м
    entrance_offset: 1.0     # леток: на столько метров перед гранью улья (+x), м
    entrance_height: 1.0     # высота летка над землёй, м

  flowers:                   # не физические тела — записи в массиве
    clusters_per_hive: 4     # полян на улей (у каждого улья — поляны на тех же расстояниях)
    flowers_per_cluster: 12
    cluster_radius: 6.0      # радиус поляны, м
    cluster_distance: [25.0, 90.0]  # расстояние поляны от улья, м
    edge_margin: 5.0         # отступ полян от края карты, м
    height: 0.3              # высота цветка над рельефом, м
    nectar_max: 3.0          # максимум нектара в цветке, ед. (§4.2)
    regen_per_s: 0.02        # восстановление нектара, ед./с (§4.2)

# ---------------------------------------------------------------- §2.1 Типы пчёл
# drag_coef, energy_max, power_idle, power_coef — подбираются из целей
# (крейсерская скорость, время полёта) в вехе M1: tools/calibrate.py.
bee_types:
  scout:                     # разведчик
    radius: 0.20             # радиус сферы, м
    mass: 0.05               # масса пустой пчелы, кг
    cargo_max: 0.0           # макс. груз нектара, ед.
    thrust_max: 1.2          # макс. тяга T_max, Н
    cruise_speed: 8.0        # цель: крейсерская скорость, м/с
    view_radius: 25.0        # радиус обзора, м
    flight_time_s: 300.0     # цель: время полёта на крейсерской скорости, с
    drag_coef: null          # c_d: √(T_max² − (mg)²) = c_d · v_cruise²
    energy_max: null         # E_max, Дж
    power_idle: null         # P_idle, Вт
    power_coef: null         # k_p в P = P_idle + k_p·|T|^1.5
  forager:                   # сборщик
    radius: 0.25
    mass: 0.08
    cargo_max: 1.0
    thrust_max: 1.8
    cruise_speed: 5.0        # пустой
    view_radius: 8.0
    flight_time_s: 240.0
    drag_coef: null
    energy_max: null
    power_idle: null
    power_coef: null
  guard:                     # охранник
    radius: 0.35
    mass: 0.15
    cargo_max: 0.0
    thrust_max: 3.0
    cruise_speed: 6.0
    view_radius: 12.0
    flight_time_s: 180.0
    drag_coef: null
    energy_max: null
    power_idle: null
    power_coef: null
  # Домашняя пчела (house) не летает и не имеет тела — её параметры в economy.

# ---------------------------------------------------------------- §2.2 Силы
physics:
  gravity: 9.81              # ускорение свободного падения, м/с²
  angular_damping: 0.002     # демпфирование вращения пчелы, Н·м·с (вращение для игры не важно)
  cargo_unit_mass: 0.04      # масса 1 ед. нектара, кг (груз сборщика 1.0 ед. = 0.04 кг)
  rain_force_coef: null      # k_rain: F_rain = k_rain · r², Н/м² (M1)
  rain_drag_multiplier: 1.3  # множитель сопротивления в дождь
  wall_stiffness: 2.0        # мягкие стенки и потолок: Н на метр выхода за границу на кг массы

wind:                        # w(x, y, z, t), M1
  height_ref: 10.0           # опорная высота профиля ветра, м
  shear_exponent: 0.14       # |w|(z) = w_ref · (z_agl / height_ref)^0.14
  min_agl: 1.0               # ниже — как на этой высоте, м
  gust_harmonics: 4          # число синусоид порывов (3–4)
  gust_amplitude: 0.3        # амплитуда порывов, доля от w_ref
  gust_period_s: [3.0, 12.0] # диапазон периодов порывов по времени, с
  gust_wavelength: [20.0, 80.0]  # диапазон длин волн порывов в пространстве, м
  turn_rate_deg_s: 0.5       # скорость поворота направления базового ветра, °/с

# ---------------------------------------------------------------- §2.3 Энергия
energy:
  dead_on_ground: true       # при E = 0 тяга = 0; после касания земли пчела погибает

# ---------------------------------------------------------------- §3.4 Автопилот
autopilot:
  kp: 4.0                    # Kp, 1/с²: a_des = Kp·(p* − p) + Kd·(v* − v)
  kd: 4.0                    # Kd, 1/с (Kd = 2·√Kp — критическое демпфирование)
  default_agl: 5.0           # fly_to без z: высота над рельефом, м
  min_clearance: 1.5         # минимальный просвет над рельефом, м
  arrive_radius: 0.5         # «долетела», м
  avoid_obstacles: true      # отталкивание от видимых препятствий (M1)
  avoid_gain: 4.0            # сила отталкивания, м/с² на границе препятствия (M1)
  avoid_margin: 2.0          # дальность действия отталкивания от поверхности, м (M1)

# ---------------------------------------------------------------- §4 Экономика улья
economy:
  start_honey: 20.0          # мёд на старте, ед.
  start_nectar: 0.0          # нектар на старте, ед.
  start_bees: {scout: 5, forager: 15, guard: 5, house: 10}   # §4.6
  collect:                   # §4.2
    rate: 0.25               # набор нектара, ед./с
    max_horizontal: 1.0      # над цветком: по горизонтали ≤, м
    max_height: 1.5          # высота над цветком ≤, м
    max_speed: 0.7           # скорость <, м/с
  processing:                # §4.3
    k_proc: 0.1              # скорость = k_proc·√n_process, ед. нектара/с
    honey_per_nectar: 0.5    # 1 ед. нектара → 0.5 ед. мёда
  feeding:                   # §4.4
    joules_per_honey: 2000.0 # 1 ед. мёда = 2000 Дж
    refuel_rate: 200.0       # скорость заправки, Дж/с
    house_consumption: 0.002 # потребление домашней пчелы, ед. мёда/с
  breeding:                  # §4.5: цена (мёд) и базовое время (с); время = база / √max(1, n_nurse)
    scout: {cost: 3.0, time_s: 30.0}
    forager: {cost: 4.0, time_s: 30.0}
    guard: {cost: 6.0, time_s: 45.0}
    house: {cost: 2.0, time_s: 20.0}

# ---------------------------------------------------------------- §5 Сенсоры и связь
sensors:
  rain_view_multiplier: 0.7  # обзор в дождь
  noise_pos_sigma: 0.3       # шум позиций при sensor_noise, м
  noise_vel_sigma: 0.1       # шум скоростей при sensor_noise, м/с
  spider_visible_radius: 4.0 # разведчик видит паука ближе, м

comms:
  radius: 15.0               # радиус связи signal(), м
  max_values: 8              # чисел в сообщении

pheromones:
  cell: 2.0                  # размер клетки сетки, м
  channels: 4
  half_life_s: 60.0          # полураспад испарения, с
  neighborhood: 3            # пчела видит окно 3×3 клетки

# ---------------------------------------------------------------- §6 Погода
weather:
  enabled: true
  mean_duration_s: 90.0      # средняя длительность состояния марковской цепи
  states:
    clear: {wind: [0.0, 1.0], rain: false}
    windy: {wind: [3.0, 6.0], rain: false}
    rain: {wind: [2.0, 4.0], rain: true}

# ---------------------------------------------------------------- §7 Враги
enemies:
  hornets:
    enabled: true
    max: 8                   # одновременно не больше (задаёт профиль)
    radius: 0.4
    mass: 0.3
    cruise_speed: 7.0
    hp: 100.0
    wave_interval_s: 60.0    # волна с края карты каждые …
    wave_growth_s: 120.0     # размер волны 1 + floor(t / wave_growth_s)
    target_max_allies: 1     # цель — пчела, у которой ≤ 1 союзника …
    target_ally_radius: 3.0  # … в радиусе, м
    kill_contact_s: 1.5      # непрерывный контакт → пчела погибает
    rob_radius: 3.0          # грабёж у летка ближе, м
    rob_guard_radius: 5.0    # … если нет охранников ближе, м
    rob_rate: 0.2            # кража мёда, ед./с
    heat_ball_min_guards: 2  # тепловой шар: охранников ≥
    heat_ball_distance: 1.0  # … на расстоянии от поверхности шершня ≤, м
    heat_ball_dps: 10.0      # урон за каждого охранника, HP/с
    flee_hp: 30.0            # HP ниже — шершень улетает к краю
  spiders:
    enabled: true
    flower_fraction: 0.10    # доля цветов с пауком
    kill_prob_per_s: 0.15    # вероятность гибели сборщика за секунду сбора

# ---------------------------------------------------------------- Пул тел (ARCHITECTURE §3.5)
pool:
  max_bees_per_hive: 100     # летающих тел на улей (задаёт профиль)

# ---------------------------------------------------------------- §8–10 Матч
advanced_control: false      # разрешить thrust(fx, fy, fz)
sensor_noise: false          # шум сенсоров
hives: []                    # [{script: путь, color: "#rrggbb"}] — по записи на улей; пусто = цвета по умолчанию

# Демо-пчёлы без раннера (веха M0): облёт точек скриптом внутри модуля.
demo:
  bees: []                   # [{kind, hive, waypoints: [[dx, dy, agl], …], loop, dwell_s}]
