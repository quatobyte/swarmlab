# Бенчмарк профиля «small» (swarmlab bench, DECISIONS №41): нагрузка как в настоящем матче —
# раннеры example_basic.py на каждом улье, около 80% пула пчёл (max_bees 50), пауки, ветер
# (шершней нет, DECISIONS №82). Пчёлы вылетают быстро (exit_per_tick), чтобы прогрев был коротким.

seed: 1
profile: small
duration_s: 60

hives:
  - {script: examples/bees/example_basic.py}

weather: {enabled: true, initial: windy}
enemies:
  spiders: {enabled: true}

economy:
  start_bees: {scout: 6, forager: 30, house: 4}
hive:
  exit_per_tick: 30
